# @package _global_
heads:
  # -----------------------------
  # ImageNet classification heads
  # -----------------------------
  imagenet_cls_small_last1:
    type: Dinov2ClassifierHead
    embed_dim: 384
    layers: 1
    checkpoint_path: ${PROJECT_ROOT}/weights/dinov2/dinov2_cls_head/dinov2_vits14_linear_head.pth

  imagenet_cls_base_last1:
    type: Dinov2ClassifierHead
    embed_dim: 768
    layers: 1
    checkpoint_path: ${PROJECT_ROOT}/weights/dinov2/dinov2_cls_head/dinov2_vitb14_linear_head.pth

  imagenet_cls_large_last1:
    type: Dinov2ClassifierHead
    embed_dim: 1024
    layers: 1
    checkpoint_path: ${PROJECT_ROOT}/weights/dinov2/dinov2_cls_head/dinov2_vitl14_linear_head.pth

  imagenet_cls_giant_last1:
    type: Dinov2ClassifierHead
    embed_dim: 1536
    layers: 1
    checkpoint_path: ${PROJECT_ROOT}/weights/dinov2/dinov2_cls_head/dinov2_vitg14_linear_head.pth

  # Classification heads (last4)
  imagenet_cls_small_last4:
    type: Dinov2ClassifierHead
    embed_dim: 384
    layers: 4
