  imagenet_cls_giant_last1:
    type: Dinov2ClassifierHead
    embed_dim: 1536
    layers: 1
    checkpoint_path: ${PROJECT_ROOT}/weights/dinov2/dinov2_cls_head/dinov2_vitg14_linear_head.pth

  # Classification heads (last4)
  imagenet_cls_small_last4:
