    patch_size: 16
    checkpoint: ${PROJECT_ROOT}/weights/dinov2/dinov2_seg_head_trained/ade20k_seg_base_reg4_last1.pth

  ade20k_seg_base_reg4_last4:
    type: Dinov2SegmentationHead
    in_channels: [768, 768, 768, 768]
    in_index: [0, 1, 2, 3]
    input_transform: resize_concat
    channels: 3072
    num_classes: 150
    patch_size: 16
    checkpoint: ${PROJECT_ROOT}/weights/dinov2/dinov2_seg_head_trained/ade20k_seg_base_reg4_last4.pth

  # -----------------------------------------
  # RAE decoders and generation (diffusion head)
  # -----------------------------------------
  rae_dinov2_base_reg4_256px:
    type: cofai.heads.GeneralDecoder
    decoder_config:
      decoder_hidden_size: 1152
      decoder_intermediate_size: 4096
      decoder_num_attention_heads: 16
      decoder_num_hidden_layers: 28
      hidden_act: gelu
      hidden_dropout_prob: 0.0
      attention_probs_dropout_prob: 0.0
      layer_norm_eps: 1e-12
      initializer_range: 0.02
      num_channels: 3
      qkv_bias: true
    patch_size: 16
    image_size: 256
    pretrained_path: ${PROJECT_ROOT}/models/RAE/models/decoders/dinov2/wReg_base/ViTXL_n08/model.pt
    normalization_stat_path: ${PROJECT_ROOT}/models/RAE/models/stats/dinov2/wReg_base/imagenet1k/stat.pt
    reshape_to_2d: true
    eps: 1e-5
    encoder_img_size: 256
    encoder_patch_size: 16
    encoder_hidden_size: 768
    encoder_mean: [0.485, 0.456, 0.406]
    encoder_std: [0.229, 0.224, 0.225]

  rae_diffusion_dinov2_base_reg4_256px:
    type: cofai.heads.RAEDiffusionHead
    decoder_config:
      decoder_hidden_size: 1152
      decoder_intermediate_size: 4096
      decoder_num_attention_heads: 16
      decoder_num_hidden_layers: 28
      hidden_act: gelu
      hidden_dropout_prob: 0.0
      attention_probs_dropout_prob: 0.0
      layer_norm_eps: 1e-12
      initializer_range: 0.02
      num_channels: 3
      qkv_bias: true
    patch_size: 16
    image_size: 256
    pretrained_decoder_path: ${PROJECT_ROOT}/models/RAE/models/decoders/dinov2/wReg_base/ViTXL_n08/model.pt
    normalization_stat_path: ${PROJECT_ROOT}/models/RAE/models/stats/dinov2/wReg_base/imagenet1k/stat.pt
    reshape_to_2d: true
    eps: 1e-5
    encoder_img_size: 256
    encoder_patch_size: 16
    encoder_hidden_size: 768
    encoder_mean: [0.485, 0.456, 0.406]
    encoder_std: [0.229, 0.224, 0.225]
    stage2_config:
      target: stage2.models.DDT.DiTwDDTHead
      params:
        input_size: 16
        patch_size: 1
        in_channels: 768
        hidden_size: [1152, 2048]
        depth: [28, 2]
        num_heads: [16, 16]
        mlp_ratio: 4.0
        class_dropout_prob: 0.1
        num_classes: 1000
        use_qknorm: false
        use_swiglu: true
        use_rope: true
        use_rmsnorm: true
        wo_shift: false
        use_pos_embed: true
    stage2_ckpt: ${PROJECT_ROOT}/models/RAE/models/DiTs/Dinov2/wReg_base/ImageNet256/DiTDH-XL/stage2_model.pt
    transport_config:
      params:
        path_type: Linear
        prediction: velocity
        time_dist_type: uniform
        time_dist_shift_dim: 196608
        time_dist_shift_base: 4096
    sampler_config:
      mode: ODE
      params:
        sampling_method: euler
        num_steps: 50
        atol: 1e-6
        rtol: 1e-3
        reverse: false
    guidance_config:
      method: cfg
      scale: 1.0
      t-min: 0.0
      t-max: 1.0
    misc_config:
      latent_size: [768, 16, 16]
      num_classes: 1000

  rae_dinov2_base_reg4_512px:
    type: cofai.heads.GeneralDecoder
    decoder_config:
      decoder_hidden_size: 1152
      decoder_intermediate_size: 4096
      decoder_num_attention_heads: 16
      decoder_num_hidden_layers: 28
      hidden_act: gelu
      hidden_dropout_prob: 0.0
      attention_probs_dropout_prob: 0.0
      layer_norm_eps: 1e-12
      initializer_range: 0.02
      num_channels: 3
      qkv_bias: true
    patch_size: 16
    image_size: 512
    pretrained_path: ${PROJECT_ROOT}/weights/RAE/decoders/dinov2/wReg_base/ViTXL_n08_i512/model.pt
    normalization_stat_path: ${PROJECT_ROOT}/weights/RAE/stats/dinov2/wReg_base/imagenet1k_512/stat.pt
    reshape_to_2d: true
    eps: 1e-5
    encoder_img_size: 512
    encoder_patch_size: 16
    encoder_hidden_size: 768
    encoder_mean: [0.485, 0.456, 0.406]
    encoder_std: [0.229, 0.224, 0.225]
