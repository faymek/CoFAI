    num_classes: 21
    patch_size: 16
    checkpoint: ${PROJECT_ROOT}/weights/dinov2/dinov2_seg_head/dinov2_vitb14_voc2012_ms_head.pth

  voc2012_seg_base_reg4_last1:
    type: Dinov2SegmentationHead
    in_channels: [768]
    in_index: [0]
    input_transform: resize_concat
    channels: 768
    num_classes: 21
    patch_size: 16
    checkpoint: ${PROJECT_ROOT}/weights/dinov2/dinov2_seg_head_trained/voc2012_seg_base_reg4_last1.pth

  voc2012_seg_base_reg4_last4:
    type: Dinov2SegmentationHead
    in_channels: [768, 768, 768, 768]
    in_index: [0, 1, 2, 3]
    input_transform: resize_concat
    channels: 3072
    num_classes: 21
    patch_size: 16
    checkpoint: ${PROJECT_ROOT}/weights/dinov2/dinov2_seg_head_trained/voc2012_seg_base_reg4_last4.pth

