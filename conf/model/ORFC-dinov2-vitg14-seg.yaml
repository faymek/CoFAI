# @package _global_
# ORFC segmentation with DINOv2 ViT-G/14 (40 blocks), sliding window
# Default: blk09 (encode blocks 0-9, slot=-30, decode blocks 10-39)
model:
  type: Dinov2SlideSegORFC
  dino_backbone:
    model_size: giant
    img_size: 518
    patch_size: 14
    dynamic_size: false
    slot: -30
    n_last_blocks: 1
    ckpt_path: ${PROJECT_ROOT}/weights/dinov2/backbone/dinov2_vitg14_pretrain.pth
  orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitg14/blk09_K64_e32.npz
  K: 64
  embedding_dim: 32
  slide_size: [512, 512]
  slide_stride: [341, 341]
  heads:
    semseg: null
