# @package _global_
defaults:
  - /args: default
  - /dataloader: default
  - /data: imagenet_sel500
  - /model: ORFC-dinov2-vitg14-cls
  - /heads: dinov2_head
  - /metrics:
    - cls_metrics
  - _self_

name: imagenet-sel500--ORFC-dinov2-vitg14-cls-blk29
description: "ORFC + DINOv2 ViT-G/14 classification on ImageNet sel500. Sweeps K at blk29 with embedding_dim=32."
dataset: ${datasets.imagenet_sel500}
test_transforms:
  - type: cofai.transforms.ResizeImage
    size: 256
    interpolation: BICUBIC
  - type: cofai.transforms.CenterCropImage
    size: 224
collate:
  mode: stack_only
task_configs:
  - label: cls
    kind: cls
    meter: ${metrics.cls_metrics}
model:
  dino_backbone:
    slot: -10
  orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitg14/blk29_K64_e32.npz
  K: 64
  embedding_dim: 32
  heads:
    cls: ${heads.imagenet_cls_giant_last1}

multi_run:
  4:
    model:
      K: 4
      orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitg14/blk29_K4_e32.npz
  8:
    model:
      K: 8
      orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitg14/blk29_K8_e32.npz
  16:
    model:
      K: 16
      orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitg14/blk29_K16_e32.npz
  64:
    model:
      K: 64
      orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitg14/blk29_K64_e32.npz
  256:
    model:
      K: 256
      orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitg14/blk29_K256_e32.npz
  64_e16:
    model:
      K: 64
      embedding_dim: 16
      orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitg14/blk29_K64_e16.npz
