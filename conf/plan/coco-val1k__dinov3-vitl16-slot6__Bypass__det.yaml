# @package _global_
defaults:
  - /args: default
  - /dataloader: default
  - _self_

name: coco-val1k__dinov3-vitl16-slot6__Bypass__det
description: "Data: COCO2017 val 1k; Model: DINOv3 ViT-L/16 slot6 (blk05); Codec: Bypass; Task: Plain-DETR detection"
args:
  real: false
dataset:
  type: CocoDetectionDataset
  root: ${PROJECT_ROOT}/data/coco_val_1k
  img_path: val2017
  file_list: coco_val_1k.txt
test_transforms:
  - type: cofai.transforms.ResizeShortSide
    size: 1024
    max_size: 1536
    keys: [img]
  - type: cofai.transforms.PadToMultiple
    multiple: 16
    keys: [img]
  - type: cofai.transforms.ToTensor
    keys: [img]
collate:
  mode: stack_only
task_configs:
  - label: det
    kind: det
    meter:
      type: CocoDetectionMeter
      ann_file: ${PROJECT_ROOT}/data/coco_val_1k/annotations/instances_val2017.json
model:
  type: DinoFeatureCodecModel
  dino_backbone:
    type: cofai.backbone.Dinov3TimmBackbone
    model_size: large
    img_size: 512
    patch_size: 16
    dynamic_size: true
    slot: 6
    # Layer indices 5/11/17/23 == CTC slot6/12/18/24. slot6 is encoded; 12/18/24 are replayed.
    n_last_blocks: [5, 11, 17, 23]
    cast_dtype: float32
    pretrained: false
    ckpt_path: ${PROJECT_ROOT}/weights/dinov3/backbone/dinov3_vitl16_pretrain_lvd1689m.safetensors
  dino_codec:
    type: cofai.latent_codecs.BypassLatentCodec
  heads:
    det:
      type: Dinov3PlainDETRHead
      checkpoint: ${PROJECT_ROOT}/weights/dinov3/det_head/plain_detr_dinov3_vitl16_checkpoint_best.pth
      dinov3_src: ${PROJECT_ROOT}/vendor/dinov3
