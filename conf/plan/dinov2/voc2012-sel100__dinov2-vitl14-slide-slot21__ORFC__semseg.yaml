# @package _global_
defaults:
  - /args: default
  - /dataloader: default
  - /data: voc2012_sel100
  - /heads: dinov2_head
  - /metrics:
    - voc2012_seg_metrics
  - _self_

name: voc2012-sel100__dinov2-vitl14-slide-slot21__ORFC__semseg
description: "Data: VOC2012 sel100; Model: DINOv2 ViT-L/14 slide slot21; Codec: ORFC; Task: semantic segmentation"
dataset: ${datasets.voc2012_sel100}
test_transforms:
  - type: cofai.transforms.ResizeImage
    size: [518]
    keys: [img]
  - type: cofai.transforms.ResizeImage
    size: [518]
    keys: [semseg]
    interpolation: NEAREST
  - type: cofai.transforms.ToTensor
    keys: [img, semseg]
collate:
  mode: stack_only
task_configs:
  - label: semseg
    kind: semseg
    meter: ${metrics.voc2012_seg_metrics}
model:
  type: DinoSlideFeatureCodecModel
  slide_size: [518, 518]
  slide_stride: [518, 518]
  dino_backbone:
    type: cofai.backbone.Dinov2TimmBackbone
    model_size: large
    img_size: 518
    patch_size: 14
    dynamic_size: false
    slot: 21  # encode blocks[:21] (blocks 0-20, "blk20")
    n_last_blocks: 1
  dino_codec:
    type: cofai.latent_codecs.OrthoRotationFeatureCodec
    orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitl14/blk20_K64_e32.npz
    K: 64
    embedding_dim: 32
  heads:
    semseg: ${heads.voc2012_seg_large_last1}

multi_run:
  4:
    model:
      dino_codec:
        K: 4
        embedding_dim: 32
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitl14/blk20_K4_e32.npz
  8:
    model:
      dino_codec:
        K: 8
        embedding_dim: 32
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitl14/blk20_K8_e32.npz
  16:
    model:
      dino_codec:
        K: 16
        embedding_dim: 32
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitl14/blk20_K16_e32.npz
  32:
    model:
      dino_codec:
        K: 32
        embedding_dim: 32
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitl14/blk20_K32_e32.npz
  64:
    model:
      dino_codec:
        K: 64
        embedding_dim: 32
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitl14/blk20_K64_e32.npz
  256:
    model:
      dino_codec:
        K: 256
        embedding_dim: 32
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitl14/blk20_K256_e32.npz
  256_e16:
    model:
      dino_codec:
        K: 256
        embedding_dim: 16
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitl14/blk20_K256_e16.npz
