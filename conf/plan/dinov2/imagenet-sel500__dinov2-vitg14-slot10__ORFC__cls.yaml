# @package _global_
defaults:
  - /args: default
  - /dataloader: default
  - /data: imagenet_sel500
  - /heads: dinov2_head
  - /metrics:
    - cls_metrics
  - _self_

name: imagenet-sel500__dinov2-vitg14-slot10__ORFC__cls
description: "Data: ImageNet sel500; Model: DINOv2 ViT-G/14 slot10; Codec: ORFC; Task: classification"
dataset: ${datasets.imagenet_sel500}
test_transforms:
  - type: cofai.transforms.ResizeImage
    size: 256
    interpolation: BICUBIC
  - type: cofai.transforms.CenterCropImage
    size: 224
collate:
  mode: stack_only
task_configs:
  - label: cls
    kind: cls
    meter: ${metrics.cls_metrics}
model:
  type: DinoFeatureCodecModel
  dino_backbone:
    type: cofai.backbone.Dinov2TimmBackbone
    model_size: giant
    img_size: 224
    patch_size: 14
    dynamic_size: false
    slot: 10  # encode blocks[:10] (blocks 0-9, "blk09")
    n_last_blocks: 1
  dino_codec:
    type: cofai.latent_codecs.OrthoRotationFeatureCodec
    orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitg14/blk09_K64_e32.npz
    K: 64
    embedding_dim: 32
  heads:
    cls: ${heads.imagenet_cls_giant_last1}

multi_run:
  4:
    model:
      dino_codec:
        K: 4
        embedding_dim: 32
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitg14/blk09_K4_e32.npz
  8:
    model:
      dino_codec:
        K: 8
        embedding_dim: 32
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitg14/blk09_K8_e32.npz
  16:
    model:
      dino_codec:
        K: 16
        embedding_dim: 32
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitg14/blk09_K16_e32.npz
  64:
    model:
      dino_codec:
        K: 64
        embedding_dim: 32
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitg14/blk09_K64_e32.npz
  256:
    model:
      dino_codec:
        K: 256
        embedding_dim: 32
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitg14/blk09_K256_e32.npz
  64_e16:
    model:
      dino_codec:
        K: 64
        embedding_dim: 16
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc/dinov2_vitg14/blk09_K64_e16.npz
