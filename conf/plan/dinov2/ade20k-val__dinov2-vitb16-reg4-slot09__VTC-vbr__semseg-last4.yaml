# @package _global_
defaults:
  - /args: default
  - /dataloader: default
  - /data: ade20k_val
  - /heads: dinov2_head
  - /metrics:
    - ade20k_seg_metrics
  - _self_

name: ade20k-val__dinov2-vitb16-reg4-slot09__VTC-vbr__semseg-last4
description: "Data: ADE20K val; Model: DINOv2 ViT-B/16 reg4 slot09 last4; Codec: VTC (vbr); Task: semantic segmentation"
dataset: ${datasets.ade20k_val}
test_transforms:
  - type: cofai.transforms.PadImage
    size: 512
    keys: [img, semseg]
  - type: cofai.transforms.PadToMultiple
    multiple: 64
    keys: [img, semseg]
  - type: cofai.transforms.AddIgnoreRegions
  - type: cofai.transforms.ToTensor
    keys: [img, semseg]
collate:
  mode: stack_only
task_configs:
  - label: semseg
    meter: ${metrics.ade20k_seg_metrics}
load:
  path: ${PROJECT_ROOT}/weights/VTC/dinov2-vitb16-slot-3--VTC-vbr.pth
  strict: false
model:
  type: DinoFeatureCodecModel
  dino_backbone:
    type: cofai.backbone.Dinov2TimmBackbone
    model_size: base
    img_size: 512
    patch_size: 16
    dynamic_size: true
    slot: 9
    n_last_blocks: 4
    with_registers: true
  dino_codec:
    type: cofai.latent_codecs.VisualTokenCodec
    h_dim: 768
    y_dim: 48
    z_dim: 48
    groups: 16
    num_prefix_tokens: 5
  heads:
    semseg: ${heads.ade20k_seg_base_reg4_last4}

multi_run:
  0:
  16:
  32:
  48:
  64:
