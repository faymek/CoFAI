# @package _global_
defaults:
  - /args: default
  - /dataloader: default
  - /data: voc2012_sel20
  - /heads: dinov2_head
  - /metrics:
    - voc2012_seg_metrics
  - _self_

name: voc2012-sel20__dinov2-vitg14-slide-slot40__VQFC__semseg
description: "Data: VOC2012 sel20; Model: DINOv2 ViT-G/14 slide slot40; Codec: VQFC; Task: semantic segmentation"
dataset: ${datasets.voc2012_sel20}
test_transforms:
  - type: cofai.transforms.ResizeImage
    size: [518]
    keys: [img]
  - type: cofai.transforms.ResizeImage
    size: [518]
    keys: [semseg]
    interpolation: NEAREST
  - type: cofai.transforms.ToTensor
    keys: [img, semseg]
collate:
  mode: stack_only
task_configs:
  - label: semseg
    kind: semseg
    meter: ${metrics.voc2012_seg_metrics}
model:
  type: DinoSlideFeatureCodecModel
  slide_size: [518, 518]
  slide_stride: [259, 259]
  dino_backbone:
    type: cofai.backbone.Dinov2TimmBackbone
    model_size: giant
    img_size: 518
    patch_size: 14
    dynamic_size: false
    slot: 40
    n_last_blocks: 1
  dino_codec:
    type: cofai.latent_codecs.VQFeatureCodec
    num_prefix_tokens: 1
    drop_prefix: true
    num_embeddings: 64
    embedding_dim: 50
    num_chunks: 1
    lmbda: 1.0
    ckpt_path: ${PROJECT_ROOT}/weights/VQFC/DINOv2/seg/epoch_300num_64chunk_1.pth.tar
  heads:
    semseg: ${heads.voc2012_seg_giant_last1}

# RD sweep: each key becomes args.quality (string) and output subdir logs/<name>/q<key>/.
# VQFC has no codec QP; keys denote num_embeddings (or variant) for bookkeeping.
# Omit args.multi_run (false) to run once with the default 64-codebook codec.
multi_run:
  16:
    model:
      dino_codec:
        num_embeddings: 16
        embedding_dim: 180
        ckpt_path: ${PROJECT_ROOT}/weights/VQFC/DINOv2/seg/epoch_300num_16chunk_1.pth.tar
  64:
    model:
      dino_codec:
        num_embeddings: 64
        embedding_dim: 50
        ckpt_path: ${PROJECT_ROOT}/weights/VQFC/DINOv2/seg/epoch_300num_64chunk_1.pth.tar
  256:
    model:
      dino_codec:
        num_embeddings: 256
        embedding_dim: 20
        ckpt_path: ${PROJECT_ROOT}/weights/VQFC/DINOv2/seg/epoch_300num_256chunk_1.pth.tar
  512:
    model:
      dino_codec:
        num_embeddings: 512
        embedding_dim: 10
        ckpt_path: ${PROJECT_ROOT}/weights/VQFC/DINOv2/seg/epoch_300num_512chunk_1.pth.tar
  512_lambda3:
    model:
      dino_codec:
        num_embeddings: 512
        embedding_dim: 10
        ckpt_path: ${PROJECT_ROOT}/weights/VQFC/DINOv2/seg/epoch_300num_512chunk_1_lmbda_3.pth.tar
