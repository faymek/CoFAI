# @package _global_
defaults:
  - /args: default
  - /dataloader: default
  - /data: imagenet_sel100
  - /heads: dinov2_head
  - /metrics:
    - cls_metrics
  - _self_

name: imagenet-sel100__dinov2-vitg14-slot40__VTM__cls
description: "Data: ImageNet sel100; Model: DINOv2 ViT-G/14 slot40; Codec: VTM; Task: classification"
dataset: ${datasets.imagenet_sel100}
test_transforms:
  - type: cofai.transforms.ResizeImage
    size: [224, 224]
collate:
  mode: stack_only
task_configs:
  - label: cls
    kind: cls
    meter: ${metrics.cls_metrics}
model:
  type: DinoFeatureCodecModel
  dino_backbone:
    type: cofai.backbone.Dinov2TimmBackbone
    model_size: giant
    img_size: 224
    patch_size: 14
    dynamic_size: false
    slot: 40
    n_last_blocks: 1
  dino_codec:
    type: cofai.latent_codecs.VtmLatentCodec
    cfg:
      vtm_path: ${PROJECT_ROOT}/weights/std_codec/VTM-21.0
      model_type: dinov2
      task: cls
      max_v: 103.2168
      min_v: -530.9767
      trun_high: 20
      trun_low: -20
      trun_flag: true
      quant_samples: 0
      quant_type: uniform
      bit_depth: 10
  heads:
    cls: ${heads.imagenet_cls_giant_last1}

# RD sweep: each key is a VTM QP, becomes args.quality and output subdir
# logs/<name>/q<qp>/. Empty values mean "only change the QP" (codec cfg fixed).
# Omit args.multi_run (false) to run once; then pass args.quality=<qp> on the CLI.
multi_run:
  37:
  42:
  47:
  52:
