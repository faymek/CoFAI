name: veri_wild2
description: GPS multi-view evaluation on VeRI-Wild2
data_root: ${project_root:}/data
checkpoint: ${project_root:}/weights/gps/VeRI-Wild2/transformer.pth
pretrained_backbone: ${project_root:}/weights/gps/imagenet_pretrain.pth
dataset:
  name: veri_wild2
  subset: All
model:
  image_size: [256, 256]
  stride_size: [12, 12]
  sie_camera: true
  sie_view: true
  sie_coefficient: 3.0
  drop_path: 0.1
  dropout: 0.1
  attention_dropout: 0.1
  pruning_layers: [6, 7, 8]
  pruning_ratios: [0.2, 0.2, 0.2]
  propagation_max_iter: 10
  beta: 0.1
  neck_feature: after
  pixel_mean: [0.485, 0.456, 0.406]
  pixel_std: [0.229, 0.224, 0.225]
evaluation:
  batch_size: 96
  workers: 8
  feature_normalize: true
  reranking: false
