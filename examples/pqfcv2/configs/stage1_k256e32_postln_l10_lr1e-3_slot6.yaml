# K=256 e=32 post-LN, slot6, float32.
# Shared OPQ init. batch 16 on token counts up to 1205.
# Longer sequences use a narrower batch: batch 16 at 1381 tokens
# crossed 22GB on the second step.

layer: blk05
slot: 6
embed_dim: 1024
n_prefix: 5
K: 256
embedding_dim: 32
epochs: 10
lr: 1.0e-3
batch_size: 16
max_batch_tokens: 19280
n_val: 50
distortion: post_ln
lmbda: 10.0
tau_start: 0.5
tau_end: 0.005
tau_schedule: exponential
grad_clip: 1.0
prior_floor: 0.0
kmeans_max_samples: 2000000
seed: 42
rms_eps: 1.0e-6
chunk_tokens: 1024
tail_dtype: float32

paths:
  feature_root: features/pqfcv2/dinov3_slot6
  split_path: features/pqfcv2/dinov3_slot6/split.json
  grids: features/pqfcv2/dinov3_slot6/grids.json
  rms_path: weights/pqfcv2/dinov3/prefix_position_patch_rms_s42_slot6.npz
  output_dir: weights/pqfcv2/dinov3/stage1_K256_e32_postln_l10_lr1e-3_slot6
  opq_init: weights/pqfcv2/dinov3/stage1_K256_e32_slot6/opq_init.npz
  backbone: weights/dinov3/backbone/dinov3_vitl16_pretrain_lvd1689m.safetensors
