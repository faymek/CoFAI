# @package _global_
defaults:
  - /args: default
  - /dataloader: default
  - _self_

name: nyuv2-val__dinov3-vitl16-slot6__ORFC__depth
description: "Data: NYUv2 val; Model: DINOv3 ViT-L/16 slot6 (blk05); Codec: ORFC-2446 Soft-PQ (ADE20K-trained); Task: depth estimation"
args:
  # ORFC-2446 .npz with pmf enables real rANS via compress/decompress.
  real: true
dataset:
  type: NYUDepthDataset
  root: ${PROJECT_ROOT}/data/NYU
  split_file: nyu_test.txt
test_transforms:
  # NYU images are 480x640 (divisible by the patch size); only the image needs to
  # become a tensor. The raw depth GT is kept as a HxW array and normalized by the
  # meter (normalization_constant).
  - type: cofai.transforms.PadToMultiple
    multiple: 16
    keys: [img]
  - type: cofai.transforms.ToTensor
    keys: [img]
collate:
  mode: stack_only
task_configs:
  - label: depth
    meter:
      type: Dinov3DepthEstimationMeter
      names: [rmse, abs_rel, a1]
      min_depth: 0.001
      max_depth: 10.0
      ignored_value: 0.0
      eval_mask: NYU_EIGEN
      normalization_constant: 1000.0
model:
  type: DinoFeatureCodecModel
  dino_backbone:
    type: cofai.backbone.Dinov3TimmBackbone
    model_size: large
    img_size: 512
    patch_size: 16
    dynamic_size: true
    # Layer 5 / blk05: encode blocks[:6], ORFC, then replay blocks[6:] into the last-layer head.
    slot: 6
    n_last_blocks: 1
    cast_dtype: float16
    pretrained: false
    ckpt_path: ${PROJECT_ROOT}/weights/dinov3/backbone/dinov3_vitl16_pretrain_lvd1689m.safetensors
  dino_codec:
    type: cofai.latent_codecs.OrthoRotationFeatureCodec
    orfc_weights_path: ${PROJECT_ROOT}/weights/orfc_2446/dinov3_vitl16_slot6/blk05_K256_e32.npz
  heads:
    depth:
      type: Dinov3DepthHead
      in_channels: [1024]
      min_depth: 0.001
      max_depth: 10.0
      n_output_channels: 256
      use_backbone_norm: true
      use_batchnorm: true
      use_cls_token: false
      bins_strategy: linear
      norm_strategy: linear
      checkpoint: ${PROJECT_ROOT}/weights/dinov3/dpt_head/dinov3_vitl16_depth_nyuv2_linear_head.pth

# ADE20K-trained blk05 SoftPQ (split_reg_cls_patch, n_prefix=5).
multi_run:
  1:
    model:
      dino_codec:
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc_2446/dinov3_vitl16_slot6/blk05_K4_e32.npz
  2:
    model:
      dino_codec:
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc_2446/dinov3_vitl16_slot6/blk05_K8_e32.npz
  3:
    model:
      dino_codec:
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc_2446/dinov3_vitl16_slot6/blk05_K16_e32.npz
  4:
    model:
      dino_codec:
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc_2446/dinov3_vitl16_slot6/blk05_K256_e32.npz
