# @package _global_
defaults:
  - /args: default
  - /dataloader: default
  - _self_

name: ade20k-val__dinov3-vitl16-slot24__ORFC__semseg
description: "Data: ADE20K val; Model: DINOv3 ViT-L/16 slot24; Codec: ORFC-2446 Soft-PQ; Task: semantic segmentation"
args:
  # ORFC-2446 .npz with pmf enables real rANS via compress/decompress.
  real: true
dataset:
  type: SegmentationDataset
  root: ${PROJECT_ROOT}/data/ADEChallengeData2016
  img_path: images/validation
  seg_map_path: annotations/validation
  file_list: null
  reduce_zero_label: true
test_transforms:
  - type: cofai.transforms.PadToMultiple
    multiple: 16
    keys: [img, semseg]
  - type: cofai.transforms.AddIgnoreRegions
  - type: cofai.transforms.ToTensor
    keys: [img, semseg]
collate:
  mode: stack_only
task_configs:
  - label: semseg
    meter:
      type: MeanIoUMetric
      num_classes: 150
model:
  type: DinoFeatureCodecModel
  dino_backbone:
    type: cofai.backbone.Dinov3TimmBackbone
    model_size: large
    img_size: 512
    patch_size: 16
    dynamic_size: true
    slot: 24
    n_last_blocks: 1
    cast_dtype: float16
    pretrained: false
    ckpt_path: ${PROJECT_ROOT}/weights/dinov3/backbone/dinov3_vitl16_pretrain_lvd1689m.safetensors
  dino_codec:
    type: cofai.latent_codecs.OrthoRotationFeatureCodec
    orfc_weights_path: ${PROJECT_ROOT}/weights/orfc_2446/dinov3_vitl16_ori/blk23_K256_e32.npz
  heads:
    semseg:
      type: Dinov3SegmentationHead
      in_channels: [1024]
      in_index: [0]
      input_transform: resize_concat
      channels: 1024
      num_classes: 150
      patch_size: 16
      checkpoint: ${PROJECT_ROOT}/weights/dinov3/semseg_head/dinov3_vitl16_semseg_ade20k_linear_head.pth

multi_run:
  1:
    model:
      dino_codec:
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc_2446/dinov3_vitl16_ori/blk23_K16_e32.npz
  2:
    model:
      dino_codec:
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc_2446/dinov3_vitl16_ori/blk23_K256_e32.npz
  3:
    model:
      dino_codec:
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc_2446/dinov3_vitl16_ori/blk23_K1024_e32.npz
  4:
    model:
      dino_codec:
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc_2446/dinov3_vitl16_ori/blk23_K512_e16.npz
  5:
    model:
      dino_codec:
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc_2446/dinov3_vitl16_ori/blk23_K1024_e16.npz
  6:
    model:
      dino_codec:
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc_2446/dinov3_vitl16_ori/blk23_K64_e8.npz
  7:
    model:
      dino_codec:
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc_2446/dinov3_vitl16_ori/blk23_K256_e8.npz
  8:
    model:
      dino_codec:
        orfc_weights_path: ${PROJECT_ROOT}/weights/orfc_2446/dinov3_vitl16_ori/blk23_K512_e8.npz
