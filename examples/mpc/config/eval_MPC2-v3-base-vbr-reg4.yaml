multi_run:
  0:
  8:
  16:
  24:
  32:
  40:
  48:
  56:
  64:

PROJECT_ROOT: ${oc.env:PROJECT_ROOT}

load:
  path: ${PROJECT_ROOT}/weights/MPC/MPC2-v3-base-vbr-reg4-pruned.pth.tar
  strict: false
  rules: # type, pattern, replacement
    - ["startswith", "dino.model", "useless"]

resolution_transform:
  type: ResolutionTransform
  mode: center_pad
  size: 64

model:
  type: MPC_I2

  dino_backbone:
    type: cofai.backbone.Dinov2TimmBackbone
    model_size: base
    img_size: 512
    patch_size: 16
    dynamic_size: true
    slot: -3
    n_last_blocks: 4
    with_registers: true
    rae_decode_blocks: 0

  dino_codec:
    type: cofai.latent_codecs.vit_feature_codec.VbrVitUnionLatentCodec
    h_dim: 768
    y_dim: 48
    z_dim: 48
    groups: 16
    num_prefix_tokens: 5

  heads: {}

allow_heads:
  - imagenet_cls_base_reg4_last4
  - ade20k_seg_base_reg4_last4
  - voc2012_seg_base_reg4_last4
  - rae_dinov2_base_reg4_256px
  - rae_dinov2_base_reg4_512px
  - rae_dinov2_base_reg4_vits_512px
  - rae_dinov2_base_reg4_vitm_512px
  - rae_dinov2_base_reg4_vitl_512px
