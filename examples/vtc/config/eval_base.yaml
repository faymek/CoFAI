# 统一的评估配置文件
# 测试时指定使用哪个dataset和哪些head
PROJECT_ROOT: ${oc.env:PROJECT_ROOT}

# 数据集配置
datasets:
  # ImageNet分类数据集
  imagenet_sel100:
    type: ClassificationDataset
    root: ${PROJECT_ROOT}/data/ImageNet_val_sel100
    split: img
    labels_file: imagenet_val_labels.txt  # 可选
    file_list: labels.txt  # 可选
  
  imagenet_sel2k:
    type: ClassificationDataset
    root: ${PROJECT_ROOT}/data/ImageNet_val_sel2k
    split: img
    labels_file: imagenet_val_labels.txt  # 可选
    file_list:
    
  # VOC2012分割数据集
  voc2012_sel20:
    type: SegmentationDataset
    root: ${PROJECT_ROOT}/data/VOC2012
    img_path: JPEGImages
    seg_map_path: SegmentationClass
    file_list: VOC2012_sel20.txt  # 可选

  voc2012_val:
    type: SegmentationDataset
    root: ${PROJECT_ROOT}/data/VOC2012
    img_path: JPEGImages
    seg_map_path: SegmentationClass
    file_list: VOC2012_val.txt

  # ADE20K分割数据集
  ade20k_val:
    type: SegmentationDataset
    root:  ${PROJECT_ROOT}/data/ADEChallengeData2016
    img_path: images/validation
    seg_map_path: annotations/validation
    file_list:
    reduce_zero_label: true

  # NYUv2深度估计数据集
  nyuv2_val:
    type: NYUDepthDataset
    root: ${PROJECT_ROOT}/data/NYU
    split_file: nyu_test.txt

# 头部模型配置
heads:

  # ADE20K分割头部

  ade20k_seg_large_last1:
    type: Dinov3SegmentationHead
    in_channels: [1024]
    in_index: [0]
    input_transform: resize_concat
    channels: 1024
    num_classes: 150
    patch_size: 16
    checkpoint: ${PROJECT_ROOT}/weights/dinov3/semseg_head/dinov3_vitl16_semseg_ade20k_linear_head.pth

  # NYUv2估计头部

  nyuv2_dep_large_last1:
    type: Dinov3DepthHead
    in_channels: [1024]
    min_depth: 0.001
    max_depth: 10.0
    n_output_channels: 256
    use_backbone_norm: true
    use_batchnorm: true
    use_cls_token: false
    bins_strategy: linear
    norm_strategy: linear
    checkpoint: ${PROJECT_ROOT}/weights/dinov3/dpt_head/dinov3_vitl16_depth_nyuv2_linear_head.pth


# 评估指标配置
metrics:
    
  # ADE20K分割指标
  ade20k_seg_metrics:
    type: MeanIoUMetric
    num_classes: 150

  nyuv2_dep_metrics:
    names: [rmse, abs_rel, a1]
    min_depth: 0.001
    max_depth: 10.0
    ignored_value: 0.0
    eval_mask: NYU_EIGEN
    normalization_constant: 1000.0
    use_tta: false

# 评估任务配置
eval_presets:

  ade20k_val_seg:
    dataset: ade20k_val
    metric: ade20k_seg_metrics
    description: "ADE20K分割任务评估(验证集)"

  nyuv2_val_dep:
    dataset: nyuv2_val
    metric: nyuv2_dep_metrics
    description: "NYUv2深度估计任务评估(验证集)"

args:
  # 全局评估参数
  real: false  # 是否使用实际压缩
  recon: 0     # 重建层 (0, 1, 2)
  verbose: true
  output_dir: ${PROJECT_ROOT}/eval_results
  save_images: true  # 是否保存重建图像
  save_predictions: true  # 是否保存预测结果 
