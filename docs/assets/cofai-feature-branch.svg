<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="690" viewBox="0 0 1500 690" role="img" aria-labelledby="title desc">
<title id="title">Feature branch: code a model split</title><desc id="desc">A model prefix extracts intermediate features at a split point. Optional token preparation produces feature values and indices. Feature and index streams are stored or transmitted and decoded. Optional post-processing restores task-required features for the model suffix and downstream tasks.</desc>
